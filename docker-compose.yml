version: '3.9'

services:
  db:
    image: postgres:13
    environment:
      POSTGRES_DB: comics_db
      POSTGRES_USER: comics_user
      POSTGRES_PASSWORD: comics_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      - DEBUG=1
      - DATABASE_URL=postgres://comics_user:comics_pass@db:5432/comics_db
      - SECRET_KEY=your-secret-key-change-in-production
      - ALLOWED_HOSTS=localhost,127.0.0.1

volumes:
  postgres_data: